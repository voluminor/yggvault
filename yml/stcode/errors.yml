# Each code defines a typed payload: {message, fields}. Diagnostic classification
# (scope/impact/reason) is assigned by the raiser in mod/rescan, not by the code.

# -----------------------------------------------------------------------------
# UPSTREAM / NETWORK
# -----------------------------------------------------------------------------

# Source archive download failed after retries.
source_download_failed:
  message: "source archive download failed for key={key} version={version} after {attempts} attempts"
  fields:
    key: string
    version: string
    source_url: string
    attempts: uint8
    timeout_seconds: uint32
    cause: error

# Brother contract validation failed during hello/list checks.
brother_contract_not_confirmed:
  message: "brother contract not confirmed for key={key}: reason={contract_reason}"
  fields:
    key: string
    contract_reason: string
    source_url: string

# Brother blob verification failed: value BLAKE3-24 does not match the tree hash.
brother_blob_hash_mismatch:
  message: "brother blob hash mismatch for key={key} version={version}: expected={expected_hash}, actual={actual_hash}"
  fields:
    key: string
    version: string
    expected_hash: string
    actual_hash: string
    source_url: string
    cause: error

# Invalid Brother RPC response: protocol, size, or codec failure. Treated as unavailable.
brother_rpc_invalid:
  message: "brother rpc invalid for key={key}: method={method}, reason={rpc_reason}"
  fields:
    key: string
    method: string
    rpc_reason: string
    source_url: string
    response_bytes: uint64
    max_bytes: uint64
    cause: error

# -----------------------------------------------------------------------------
# ARCHIVE / CONTENT VALIDATION
# -----------------------------------------------------------------------------

# Numeric limit violation for a source archive or publish payload.
# check is the violated limit; value/max_value are the observed value and limit.
archive_limit_exceeded:
  message: "archive limit exceeded for key={key} version={version}: check={check}, value={value}, max_value={max_value}"
  fields:
    key: string
    version: string
    check: string
    value: uint64
    max_value: uint64
    cause: error

# Archive is structurally invalid or contains an unsupported entry.
archive_rejected:
  message: "source archive rejected for key={key} version={version}: check={check_name}"
  fields:
    key: string
    version: string
    format: string
    check_name: string
    path: string
    cause: error

# -----------------------------------------------------------------------------
# CACHE / DISK / IO
# -----------------------------------------------------------------------------

# Cache quota was exceeded during durable/hot checks: admission, hard limit, or post-eviction.
# Field meaning depends on cache_area and check_name; consumers must branch on them.
cache_quota_exceeded:
  message: "cache quota exceeded: area={cache_area}, check={check_name}, max_total_bytes={max_total_bytes}, current_total_bytes={current_total_bytes}, incoming_bytes={incoming_bytes}, admission_bytes={admission_bytes}, evict_to_bytes={evict_to_bytes}"
  fields:
    cache_area: string
    check_name: string
    max_total_bytes: uint64
    current_total_bytes: uint64
    incoming_bytes: uint64
    admission_bytes: uint64
    evict_to_bytes: uint64
    retain_latest_per_key: uint32
    cause: error

# -----------------------------------------------------------------------------
# ARTIFACTS / MATERIALIZATION
# -----------------------------------------------------------------------------

# Artifact exceeds the metadata size policy.
artifact_size_exceeded:
  message: "artifact size exceeds limit for key={key} version={version}: check={check_name}, size_bytes={size_bytes}, max_bytes={max_bytes}"
  fields:
    key: string
    version: string
    materializer_id: string
    artifact_kind: string
    listener_id: string
    check_name: string
    size_bytes: uint64
    max_bytes: uint64

# Artifact build failed an output, hot-cache, stale-state, body-hash, or size check.
artifact_build_failed:
  message: "artifact materialization failed for key={key} version={version}: check={check_name}"
  fields:
    key: string
    version: string
    materializer_id: string
    artifact_kind: string
    listener_id: string
    check_name: string
    expected_hash: string
    actual_hash: string
    expected_size: uint64
    actual_size: uint64
    cause: error

# -----------------------------------------------------------------------------
# OVERLAY / STATE
# -----------------------------------------------------------------------------

# Composer package name is already owned by another key; the package is skipped.
composer_name_collision:
  message: "composer package name collision for key={key}: name={package_name} already owned by key={conflicting_key}"
  fields:
    key: string
    package_name: string
    conflicting_key: string
