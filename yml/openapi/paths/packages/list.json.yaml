get:
  tags: [ composer ]
  operationId: getComposerPackageList
  x-func: GetComposerPackageList
  summary: Composer package-name list
  description: >-
    Returns available Composer package names after package-name collision
    resolution. The optional `filter` supports Composer-style `*` wildcards and
    is validated before matching so oversized or malformed filters return 400.
  parameters:
    - name: filter
      in: query
      required: false
      description: Composer filter with optional `*` wildcards.
      schema:
        type: string
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Available Composer package names.
      headers:
        ETag:
          description: Strong cache validator for the generated package list.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated Composer metadata.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: schemas/composer_package_list
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
