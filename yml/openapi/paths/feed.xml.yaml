get:
  tags: [ mirror ]
  operationId: getFeed
  x-func: GetFeed
  summary: Global Atom release-event feed
  description: >-
    Atom 1.0 feed built from the cross-key release history. New events come
    first. The feed includes publish events and archive mutation events; a
    mutation is a separate entry with an ID that includes the content hash. The
    number of entries is capped by `web.pages.feed_size`. Query parameters are
    rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Atom 1.0 feed
      headers:
        ETag:
          description: Strong cache validator for the generated feed body.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
      content:
        application/atom+xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="utf-8"?>
            <feed xmlns="http://www.w3.org/2005/Atom">
              <id>https://modules.example.org/feed.xml</id>
              <title>yggvault - new releases</title>
              <updated>2026-04-02T09:00:00Z</updated>
              <link rel="self" href="/feed.xml"/>
              <entry>
                <id>ratatoskr@v1.2.3#blake3-24:ef01</id>
                <title>ratatoskr v1.2.3 - archive updated</title>
                <updated>2026-04-02T09:00:00Z</updated>
                <link href="/ratatoskr/v1.2.3"/>
                <content type="html">&lt;p&gt;Upstream re-released the archive.&lt;/p&gt;</content>
              </entry>
              <entry>
                <id>ratatoskr@v1.2.3#blake3-24:abcd</id>
                <title>ratatoskr v1.2.3 - released</title>
                <updated>2026-04-01T12:00:00Z</updated>
                <link href="/ratatoskr/v1.2.3"/>
                <content type="html">&lt;h2&gt;Changelog&lt;/h2&gt;&lt;ul&gt;&lt;li&gt;fix&lt;/li&gt;&lt;/ul&gt;</content>
              </entry>
            </feed>
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
