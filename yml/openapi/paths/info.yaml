get:
  tags: [ service ]
  operationId: getInfo
  x-func: GetInfo
  summary: Public node identity card
  description: >-
    Public node identity shared by all routes: name, optional description,
    optional location, public contacts, clearnet domain, and Yggdrasil host. The
    same identity data is also published through mesh `info`/`inet` signals.
    Empty `domain` or `ygg_host` means the matching entry is disabled.
  responses:
    '200':
      description: Public node identity card.
      headers:
        Cache-Control:
          description: No-cache policy for live node identity.
          schema:
            type: string
            example: no-cache, max-age=0, must-revalidate
      content:
        application/json:
          schema:
            $ref: schemas/info
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
