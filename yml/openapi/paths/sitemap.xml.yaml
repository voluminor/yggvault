get:
  tags: [ assets ]
  operationId: getSitemap
  x-func: GetSitemap
  summary: Node sitemap
  description: >-
    Sitemap of crawlable HTML pages for the current entry: catalog, mirror-key
    pages, version pages with path-safe version labels, and the metrics index
    when public metrics are enabled. Absolute URLs use the entry scheme, host,
    and nested prefix; the URL count is capped by `web.pages.sitemap_size`.
    Query parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: XML sitemap.
      headers:
        ETag:
          description: Strong cache validator derived from the entry host and content freshness.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        application/xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="UTF-8"?>
            <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
              <url><loc>https://modules.example.org/</loc><lastmod>2026-07-16T18:42:47Z</lastmod></url>
              <url><loc>https://modules.example.org/yggvault</loc><lastmod>2026-07-16T18:42:47Z</lastmod></url>
              <url><loc>https://modules.example.org/yggvault/v0.3.4</loc><lastmod>2026-07-16T18:42:47Z</lastmod></url>
            </urlset>
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
