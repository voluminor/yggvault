get:
  tags: [ assets ]
  operationId: getSitemap
  x-func: GetSitemap
  summary: Node sitemap
  description: >-
    Sitemap of crawlable HTML pages for the current entry: catalog, mirror-key
    pages, version pages with path-safe version labels, and the metrics index
    when public metrics are enabled. Absolute URLs use the entry scheme, host,
    and nested prefix; the URL count is capped by `web.pages.sitemap_size`.
    Query parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: XML sitemap.
      headers:
        ETag:
          description: Strong cache validator derived from the entry host and content freshness.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
      content:
        application/xml:
          schema:
            type: string
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
