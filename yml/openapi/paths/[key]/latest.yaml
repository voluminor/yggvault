get:
  tags: [ mirror ]
  operationId: getMirrorLatest
  x-func: GetMirrorLatest
  summary: Latest mirrored version as plain text
  description: >-
    Returns the latest indexed version for a mirrored key as a
    newline-terminated plain-text body. Unknown keys or keys without indexed
    versions return 404.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Latest version followed by a newline.
      headers:
        ETag:
          description: Strong cache validator for the generated response body.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
