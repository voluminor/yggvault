get:
  tags: [ mirror ]
  operationId: getKeyReleases
  x-func: GetKeyReleases
  summary: Paginated release list for one key
  description: >-
    Lightweight release snapshot for one key. Each item contains version, time,
    size, and a link to the detail document; release notes and artifact lists
    are intentionally omitted. Pagination uses keyset cursors:
    `?after=<next-from-previous-response>`. The `next` field is omitted on the
    last page.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/after
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Paginated release list.
      headers:
        ETag:
          description: Strong cache validator for the generated response body.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        application/json:
          schema:
            $ref: schemas/release_list
        text/plain:
          schema:
            type: string
          example: >-
            {"key":"yggvault","source":{"url":"https://github.com/voluminor/yggvault","status":"available","last_scan":"2026-07-16T18:40:00Z"},"releases":[{"version":"v0.3.4","time":"2026-07-16T18:42:47Z","size":7340032,"url":"/yggvault/v0.3.4.json"}]}
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
