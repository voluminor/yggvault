get:
  tags: [ mirror, archive, go ]
  operationId: getVersionFile
  x-func: GetVersionFile
  summary: "Per-version file: <version>.json, <version>.zip, or <version>.tar.gz"
  description: >-
    Dispatches by file extension. `.json` returns the release detail document,
    `.zip` returns a deterministic zip artifact, and `.tar.gz` returns a
    deterministic tar.gz artifact. Archive artifacts are always the raw uploaded
    source tree (top-dir `<key>-<version>/`) and are host-independent; Go-module
    import-path rewriting is exposed only on the go-proxy `@v/<version>.zip`
    endpoint. A bare `<version>` without an extension renders the browser HTML
    version page. If the version exists but its archive has not been
    materialized yet, the archive request returns 503; retry after a short
    delay. Query parameters are rejected.
  parameters:
    - $ref: parameters/key
    - name: versionFile
      in: path
      required: true
      description: Version file name, for example `v1.2.3.json`, `v1.2.3.zip`, or `v1.2.3.tar.gz`.
      schema:
        type: string
    - $ref: parameters/if_none_match
    - $ref: parameters/if_modified_since
    - $ref: parameters/range
    - $ref: parameters/if_range
  responses:
    '200':
      description: Release detail JSON, browser HTML, or streamed archive bytes selected by file extension.
      headers:
        ETag:
          description: Strong cache validator for the generated body or artifact.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated data.
          schema:
            type: string
        Last-Modified:
          description: Modification time of the opened hot-cache artifact file.
          schema:
            type: string
        Accept-Ranges:
          description: Byte range support marker for archive artifacts. The value is `bytes`.
          schema:
            type: string
        Content-Length:
          description: Body size in bytes. Archive responses use a fixed length, not chunked transfer.
          schema:
            type: integer
            format: int64
        Content-Disposition:
          description: Download file name for archive responses. The value is `attachment; filename="<key>-<version>.<ext>"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: schemas/release_detail
        application/octet-stream:
          schema:
            type: string
            format: binary
        text/html:
          schema:
            type: string
            format: binary
    '206':
      $ref: responses/partial_content
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '416':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
    '503':
      $ref: responses/default_error
