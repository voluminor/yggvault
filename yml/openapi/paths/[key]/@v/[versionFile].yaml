get:
  tags: [ go ]
  operationId: getVersionArtifact
  x-func: GetVersionArtifact
  summary: "Go proxy version artifact: .info, .mod, or .zip"
  description: >-
    Go module proxy endpoint. The file extension selects the body: `.info`
    returns the Go proxy info JSON, `.mod` returns the raw or rewritten
    `go.mod`, and `.zip` streams the Go module zip from the hot cache. Versions
    are unescaped before lookup. Major-version paths such as
    `/{key}/v2/@v/v2.1.0.zip` are accepted and mapped to the same operation. The
    route is available only when content detection has published a Go overlay. If
    import rewriting is required but `overlay.go.rewrite_enabled` is false, the
    Go artifact is not published. Composer dist and universal `.tar.gz` archives
    are served from `/<key>/<version>.{zip,tar.gz}` instead. If the version
    exists but its zip has not been materialized yet, the `.zip` request returns
    503; retry after a short delay.
  parameters:
    - $ref: parameters/key
    - name: versionFile
      in: path
      required: true
      description: Version file name, for example `v1.2.3.info`, `v1.2.3.mod`, or `v1.2.3.zip`.
      schema:
        type: string
        example: v0.3.4.zip
    - $ref: parameters/if_none_match
    - $ref: parameters/if_modified_since
    - $ref: parameters/range
    - $ref: parameters/if_range
  responses:
    '200':
      description: Generated Go proxy response body.
      headers:
        ETag:
          description: Strong cache validator for the generated body or zip artifact.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated data.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
        Last-Modified:
          description: Modification time of the opened hot-cache zip file.
          schema:
            type: string
            example: Thu, 16 Jul 2026 18:42:47 GMT
        Accept-Ranges:
          description: Byte range support marker for zip artifacts. The value is `bytes`.
          schema:
            type: string
            example: bytes
        Content-Length:
          description: Body size in bytes. Zip responses use a fixed length, not chunked transfer.
          schema:
            type: integer
            format: int64
            example: 10485760
        Content-Disposition:
          description: Download file name for the `.zip` module artifact. The value is `attachment; filename="<key>@<version>.zip"`.
          schema:
            type: string
            example: attachment; filename="yggvault@v0.3.4.zip"
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '206':
      $ref: responses/partial_content
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '416':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
    '503':
      $ref: responses/default_error
