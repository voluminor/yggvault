get:
  tags: [ go ]
  operationId: getGoVersionList
  x-func: GetGoVersionList
  summary: Unpaginated Go-compatible version list
  description: >-
    Returns the Go proxy `@v/list` body: one canonical version per line,
    newest first. The route is available only for keys and major lines where
    content detection has published a Go overlay. Query parameters are rejected.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Plain-text Go version list.
      headers:
        ETag:
          description: Strong cache validator for the generated response body.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
      content:
        text/plain:
          schema:
            type: string
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
