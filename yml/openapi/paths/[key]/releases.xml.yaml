get:
  tags: [ mirror ]
  operationId: getKeyFeed
  x-func: GetKeyFeed
  summary: Atom release-event feed for one key
  description: >-
    Atom 1.0 feed for release history events of one key. New events come first.
    The feed includes publish events and archive mutation events; a mutation is
    a separate entry with an ID that includes the content hash. The number of
    entries is capped by `web.pages.feed_size`. Query parameters are rejected.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Atom 1.0 feed for one key.
      headers:
        ETag:
          description: Strong cache validator for the generated feed body.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        application/atom+xml:
          schema:
            type: string
          example: |
            <?xml version="1.0" encoding="utf-8"?>
            <feed xmlns="http://www.w3.org/2005/Atom">
              <id>urn:ygg:feed:yggvault</id>
              <title>yggvault — releases</title>
              <updated>2026-07-16T18:42:47Z</updated>
              <link rel="self" href="/yggvault/releases.xml"/>
              <entry>
                <title>yggvault@v0.3.4 — archive updated</title>
                <id>urn:ygg:yggvault:v0.3.4:fedcba9876543210fedcba9876543210fedcba9876543210</id>
                <updated>2026-07-16T18:42:47Z</updated>
                <link href="/yggvault/v0.3.4" rel="alternate"/>
                <content type="html">&lt;p&gt;Upstream archive was updated.&lt;/p&gt;</content>
              </entry>
            </feed>
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
