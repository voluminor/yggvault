get:
  tags: [ go ]
  operationId: getGoLatest
  x-func: GetGoLatest
  summary: Latest version metadata for the Go module proxy
  description: >-
    Returns the Go proxy `@latest` JSON document for the newest active canonical
    version in the requested major line. Major-version paths such as
    `/{key}/v2/@latest` are accepted and mapped to the same operation. The route
    is available only when content detection has published a Go overlay for the
    key and major path.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Go proxy latest-version document.
      headers:
        ETag:
          description: Strong cache validator for the generated response body.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        application/json:
          schema:
            $ref: schemas/go_info
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
