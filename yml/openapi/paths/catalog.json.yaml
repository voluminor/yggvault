get:
  tags: [ mirror ]
  operationId: getCatalog
  x-func: GetCatalog
  summary: Catalog of all configured mirror keys
  description: >-
    Lightweight cross-key snapshot containing each key, latest version,
    operational status, source classification, and source availability. Release
    notes and artifact lists are omitted. The body is served from the metadata
    cache and does not perform a live storage scan. Query parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Catalog document.
      headers:
        ETag:
          description: Strong cache validator for the generated response body.
          schema:
            type: string
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: schemas/catalog
        text/plain:
          schema:
            type: string
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
