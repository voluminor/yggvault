get:
  tags: [ composer ]
  operationId: getComposerPackages
  x-func: GetComposerPackages
  summary: Composer repository root metadata
  description: >-
    Returns the Composer repository `packages.json` document. yggvault uses the
    Composer v2 lazy metadata flow: the root document advertises the p2
    `metadata-url`, the complete prebuilt package-name list, and the package
    list endpoint. Query parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: Composer repository root document.
      headers:
        ETag:
          description: Strong cache validator for the generated root document.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated Composer metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        application/json:
          schema:
            $ref: schemas/composer_packages
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '429':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
