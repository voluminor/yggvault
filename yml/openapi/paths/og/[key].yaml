get:
  tags: [ assets ]
  operationId: getOgKey
  x-func: GetOgKey
  summary: Module Open Graph banner
  description: >-
    Open Graph banner for one mirror key: key name, latest version, version
    count, and last publish date. Unknown or empty keys return 404. Generated on
    demand and cached. Query parameters are rejected.
  parameters:
    - $ref: parameters/key
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: PNG Open Graph banner.
      headers:
        ETag:
          description: Strong cache validator derived from key content freshness.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        image/png:
          schema:
            type: string
            format: binary
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
