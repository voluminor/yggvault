get:
  tags: [ service ]
  operationId: getMetricsIndex
  x-func: GetMetricsIndex
  summary: Human-readable metrics index
  description: >-
    Returns a small HTML page linking the enabled metric groups for the current
    entry. If both public and internal metric groups are disabled on that entry,
    the route is not advertised and returns 404.
  responses:
    '200':
      description: HTML metrics index.
      headers:
        Cache-Control:
          description: No-cache policy for the metrics index.
          schema:
            type: string
      content:
        text/html; charset=utf-8:
          schema:
            type: string
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
