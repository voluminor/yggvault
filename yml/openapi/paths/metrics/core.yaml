get:
  tags: [ service ]
  operationId: getMetricsCore
  x-func: GetMetricsCore
  summary: Core HTTP request metrics
  description: >-
    JSON snapshot of core HTTP request signals aggregated across operations:
    request and error totals and request-duration sum/count. Served only when
    public metrics are enabled for the current entry (`metrics.web.public` or
    `metrics.ygg.public`); otherwise the endpoint returns 404.
  responses:
    '200':
      description: Core HTTP request metrics.
      headers:
        Cache-Control:
          description: No-cache policy for live metrics.
          schema:
            type: string
            example: no-cache, max-age=0, must-revalidate
      content:
        application/json:
          schema:
            $ref: schemas/metrics_core
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
