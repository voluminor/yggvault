get:
  tags: [ service ]
  operationId: getMetricsCache
  x-func: GetMetricsCache
  summary: Cache and storage-serving metrics
  description: >-
    JSON snapshot of the metadata/hot-file RAM cache and the storage engine
    (Pebble gauges, event counters, hot-cache enforcement). Served only when
    public metrics are enabled for the current entry (`metrics.web.public` or
    `metrics.ygg.public`); otherwise the endpoint returns 404.
  responses:
    '200':
      description: Cache and storage metrics.
      headers:
        Cache-Control:
          description: No-cache policy for live metrics.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: schemas/metrics_cache
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
