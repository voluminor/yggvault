get:
  tags: [ service ]
  operationId: getMetricsErrors
  x-func: GetMetricsErrors
  summary: Error registry metrics
  description: >-
    JSON view of the Error Registry: active and dropped diagnostic counts plus
    the bounded newest-first recent buffer for real-time triage. Served only when
    public metrics are enabled for the current entry (`metrics.web.public` or
    `metrics.ygg.public`); otherwise the endpoint returns 404.
  responses:
    '200':
      description: Error registry metrics.
      headers:
        Cache-Control:
          description: No-cache policy for live metrics.
          schema:
            type: string
            example: no-cache, max-age=0, must-revalidate
      content:
        application/json:
          schema:
            $ref: schemas/metrics_errors
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
