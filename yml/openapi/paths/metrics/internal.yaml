get:
  tags: [ service ]
  operationId: getMetricsInternal
  x-func: GetMetricsInternal
  summary: Full Prometheus text exposition
  description: >-
    Complete Prometheus-compatible text exposition (version 0.0.4) covering every
    metric group: core, cache, rescan, errors, and internal runtime signals. Built
    for scrapers such as VictoriaMetrics and Prometheus. Served only when internal
    metrics are enabled for the current entry (`metrics.web.internal` or
    `metrics.ygg.internal`); otherwise the endpoint returns 404.
  responses:
    '200':
      description: Prometheus text exposition (version 0.0.4).
      headers:
        Cache-Control:
          description: No-store policy for metric snapshots.
          schema:
            type: string
      content:
        text/plain; version=0.0.4; charset=utf-8:
          schema:
            type: string
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
