get:
  tags: [ assets ]
  operationId: getFavicon
  x-func: GetFavicon
  summary: Node favicon
  description: >-
    Multi-resolution favicon (16/32/48) generated from the node logo. Pre-rendered
    at startup and served with a strong content ETag. Query parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: ICO favicon.
      headers:
        ETag:
          description: Strong cache validator derived from the generated body.
          schema:
            type: string
        Cache-Control:
          description: Long-lived cache policy for the constant asset.
          schema:
            type: string
      content:
        image/x-icon:
          schema:
            type: string
            format: binary
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
