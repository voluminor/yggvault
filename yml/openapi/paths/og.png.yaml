get:
  tags: [ assets ]
  operationId: getOgNode
  x-func: GetOgNode
  summary: Node Open Graph banner
  description: >-
    Open Graph banner for the whole node (catalog page): mirror-key and version
    counts, plus the last publish date. Generated on demand and cached. Query
    parameters are rejected.
  parameters:
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: PNG Open Graph banner.
      headers:
        ETag:
          description: Strong cache validator derived from content freshness.
          schema:
            type: string
            example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
        Cache-Control:
          description: Cache policy for generated metadata.
          schema:
            type: string
            example: public, must-revalidate, max-age=300
      content:
        image/png:
          schema:
            type: string
            format: binary
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
