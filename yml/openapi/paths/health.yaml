get:
  tags: [ service ]
  operationId: getHealth
  x-func: GetHealth
  summary: Health status for the current entry channel
  description: >-
    Returns the live node health snapshot for the listener that handled the
    request. The response is not cached and includes the entry source (`web` or
    `yggdrasil`), current runtime status, recent diagnostic count, and the last
    completed rescan timestamp when available.
  responses:
    '200':
      description: Live health snapshot.
      headers:
        Cache-Control:
          description: No-cache policy for live service state.
          schema:
            type: string
            example: no-cache, max-age=0, must-revalidate
      content:
        application/json:
          schema:
            $ref: schemas/health
    '400':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
