get:
  tags: [ assets ]
  operationId: getLogo
  x-func: GetLogo
  summary: Node logo PNG
  description: >-
    Square transparent PNG of the node logo at a whitelisted edge size
    (16, 32, 48, 180, 192, 512). Pre-rendered at startup; other sizes return 404.
    Query parameters are rejected.
  parameters:
    - name: size
      in: path
      required: true
      description: Whitelisted logo edge in pixels, for example `192`.
      schema:
        type: string
    - $ref: parameters/if_none_match
  responses:
    '200':
      description: PNG logo.
      headers:
        ETag:
          description: Strong cache validator derived from the generated body.
          schema:
            type: string
        Cache-Control:
          description: Long-lived cache policy for the constant asset.
          schema:
            type: string
      content:
        image/png:
          schema:
            type: string
            format: binary
    '304':
      $ref: responses/not_modified
    '400':
      $ref: responses/default_error
    '404':
      $ref: responses/default_error
    '405':
      $ref: responses/default_error
    '414':
      $ref: responses/default_error
    '431':
      $ref: responses/default_error
    '500':
      $ref: responses/default_error
