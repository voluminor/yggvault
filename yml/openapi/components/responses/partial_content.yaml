description: Partial artifact response produced for a satisfiable byte `Range` request.
headers:
  Content-Range:
    description: Served byte range and total resource size.
    schema:
      type: string
      example: bytes 0-1048575/12582912
  Accept-Ranges:
    description: Byte range support marker. The value is `bytes`.
    schema:
      type: string
      example: bytes
  ETag:
    description: Strong cache validator derived from the artifact body digest.
    schema:
      type: string
      example: '"0123456789abcdef0123456789abcdef0123456789abcdef"'
  Cache-Control:
    description: Cache policy configured for served data responses.
    schema:
      type: string
      example: public, max-age=300
  Last-Modified:
    description: Modification time of the opened hot-cache artifact file.
    schema:
      type: string
      example: Thu, 16 Jul 2026 18:42:47 GMT
  Content-Length:
    description: Partial body length in bytes. Artifact responses are sent with a fixed length, not chunked transfer.
    schema:
      type: integer
      format: int64
      example: 1048576
  Content-Disposition:
    description: Download file name for archive responses. The value is `attachment; filename="<key>-<version>.<ext>"`.
    schema:
      type: string
      example: attachment; filename="yggvault-v0.3.4.tar.gz"
content:
  application/octet-stream:
    schema:
      type: string
      format: binary
