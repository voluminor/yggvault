name: key
in: path
required: true
description: >-
  Registry key configured in `release_mirrors`. Valid configuration keys match
  `^[a-z0-9][a-z0-9._-]{1,38}[a-z0-9]$`, cannot look like a Go major suffix
  such as `v2`, and cannot use reserved route names including `list`, `latest`,
  `@v`, `@latest`, `health`, `info`, `metrics`, `openapi.json`, `p`, `p2`,
  `packages`, `packages.json`, `rpc`, `catalog.json`, `feed.xml`, `logo`,
  `og.png`, `favicon.ico`, and `sitemap.xml`.
schema:
  type: string
