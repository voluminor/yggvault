type: object
required: [ Version, Time ]
properties:
  Version:
    type: string
    description: Canonical Go module version returned by the proxy.
    example: v0.3.4
  Time:
    type: string
    format: date-time
    description: Release timestamp returned in the Go proxy `.info` document.
    example: "2026-07-16T18:42:47Z"
