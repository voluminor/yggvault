type: object
required: [ cache, storage ]
description: RAM metadata cache, hot-artifact cache, and storage-engine serving metrics.
properties:
  cache:
    type: object
    description: In-memory metadata and hot-artifact cache counters.
    required:
      - hits
      - misses
      - materializations
      - materializations_aborted
      - evictions
      - singleflight_shared
      - entries
      - bytes
    properties:
      hits: { type: integer, format: int64 }
      misses: { type: integer, format: int64 }
      materializations: { type: integer, format: int64 }
      materializations_aborted: { type: integer, format: int64 }
      evictions: { type: integer, format: int64 }
      singleflight_shared: { type: integer, format: int64 }
      entries: { type: integer, format: int64 }
      bytes: { type: integer, format: int64 }
  storage:
    type: object
    description: Pebble engine gauges, event counters, and hot-cache enforcement counters.
    required:
      - live_bytes
      - obsolete_bytes
      - zombie_bytes
      - wal_bytes
      - memtable_bytes
      - compaction_debt_bytes
      - compaction_inprogress_bytes
      - compactions
      - flushes
      - block_cache_hits
      - block_cache_misses
      - write_stalls
      - background_errors
      - data_corruptions
      - disk_slow
      - possible_api_misuse
      - flush_duration_nanos
      - compaction_duration_nanos
      - hot_enforce_walks
      - hot_enforce_walk_duration_nanos
    properties:
      live_bytes: { type: integer, format: int64 }
      obsolete_bytes: { type: integer, format: int64 }
      zombie_bytes: { type: integer, format: int64 }
      wal_bytes: { type: integer, format: int64 }
      memtable_bytes: { type: integer, format: int64 }
      compaction_debt_bytes: { type: integer, format: int64 }
      compaction_inprogress_bytes: { type: integer, format: int64 }
      compactions: { type: integer, format: int64 }
      flushes: { type: integer, format: int64 }
      block_cache_hits: { type: integer, format: int64 }
      block_cache_misses: { type: integer, format: int64 }
      write_stalls: { type: integer, format: int64 }
      background_errors: { type: integer, format: int64 }
      data_corruptions: { type: integer, format: int64 }
      disk_slow: { type: integer, format: int64 }
      possible_api_misuse: { type: integer, format: int64 }
      flush_duration_nanos: { type: integer, format: int64 }
      compaction_duration_nanos: { type: integer, format: int64 }
      hot_enforce_walks: { type: integer, format: int64 }
      hot_enforce_walk_duration_nanos: { type: integer, format: int64 }
