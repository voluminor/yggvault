type: object
required: [ packages ]
additionalProperties: true
properties:
  packages:
    type: object
    description: One package name mapped to its Composer versions; yggvault serves non-minified p2 metadata.
    example:
      vendor/package:
        - name: vendor/package
          version: v1.2.3
          dist:
            type: zip
            url: /library/v1.2.3.zip
            reference: v1.2.3
            shasum: 0123456789abcdef0123456789abcdef01234567
    additionalProperties:
      type: array
      items:
        $ref: schemas/composer_package_version
