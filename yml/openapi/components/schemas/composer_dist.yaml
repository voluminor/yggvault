type: object
required: [ type, url, reference ]
additionalProperties: true
properties:
  type:
    type: string
    enum: [ zip, tar ]
    description: Composer dist type. yggvault currently publishes zip dist URLs.
  url:
    type: string
    description: Universal zip URL for this version, for example `/<key>/<version>.zip`.
  reference:
    type: string
    description: Version string or upstream reference used by Composer.
  shasum:
    type: string
    description: SHA-1 digest of the dist zip body.
