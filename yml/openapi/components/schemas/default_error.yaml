type: object
required: [ error, message ]
properties:
  error:
    type: string
    description: Short machine-oriented error code or stable error class.
    example: not_found
  message:
    type: string
    description: Human-readable error description. Error text is always emitted in English.
    example: resource not found
  request_id:
    type: string
    description: Request identifier that can be used to find the matching access log entry.
    example: 0123456789abcdef
