type: object
required: [ name, version, dist ]
additionalProperties: true
properties:
  name:
    type: string
    description: Composer package name in `vendor/name` form.
    example: vendor/package
  version:
    type: string
    description: Composer version string exposed to clients.
    example: v1.2.3
  version_normalized:
    type: string
    description: Composer-normalized version, when available from the upstream package metadata.
    example: 1.2.3.0
  type:
    type: string
    description: Composer package type copied from upstream metadata when present.
    example: library
  time:
    type: string
    format: date-time
    description: Release timestamp used by Composer clients.
    example: "2026-07-16T18:42:47Z"
  source:
    type: object
    description: Upstream Composer source object, preserved when present.
    example:
      type: git
      url: https://github.com/example/library.git
      reference: 0123456789abcdef0123456789abcdef01234567
    additionalProperties: true
  dist:
    $ref: schemas/composer_dist
  require:
    type: object
    description: Runtime dependency constraints copied from upstream `composer.json`.
    example:
      php: ">=8.2"
    additionalProperties:
      type: string
      example: ">=8.2"
  require-dev:
    type: object
    description: Development dependency constraints copied from upstream `composer.json`.
    example:
      phpunit/phpunit: "^11.0"
    additionalProperties:
      type: string
      example: "^11.0"
  autoload:
    type: object
    description: Composer autoload section copied from upstream metadata.
    example:
      psr-4:
        "Vendor\\Package\\": src/
    additionalProperties: true
  license:
    type: array
    description: License identifiers copied from upstream metadata, when present.
    example: [ MIT ]
    items:
      type: string
      example: MIT
