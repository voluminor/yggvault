type: object
required: [ name, domain, ygg_host ]
properties:
  name:
    type: string
    description: >-
      Public node name from `info.name`; when empty, the server derives it from
      the configured domain or Yggdrasil host.
  version:
    type: string
    description: "Build version of the running node from compiled build metadata (for example `v0.1.7`)."
  description:
    type: string
    description: "Free-form public node description or peering policy from `info.description`; omitted when unset."
  location:
    type: string
    description: "Optional physical or administrative location from `info.location`; omitted when unset."
  contacts:
    type: object
    description: "Public contact map from `info.contacts`, grouped by contact type; omitted when unset."
    additionalProperties:
      type: array
      items:
        type: string
  domain:
    type: string
    description: "Configured clearnet domain from `web.server.domain`; empty when the web entry is disabled."
  ygg_host:
    type: string
    description: "Public Yggdrasil identity host (`<hex>.pk.ygg`); empty when the Yggdrasil entry is disabled."
  route_prefix:
    type: string
    description: >-
      URL segment the package API is mounted under when the node runs embedded behind a custom
      static frontend (nested mode); empty when the API is served at the root. For example `pkg`
      means routes live under `/pkg/...`. Absent on nodes that predate this field.
