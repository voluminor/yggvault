# goconfgen schema for the runtime configuration.
#
# Leaf attributes: type | usage | value | min | max | enum | enum_name.
# Enum leaves do not use `type`; they use `enum: [..]` and `enum_name:`.
# Each enum_name must be unique across the whole schema.
# min/max use the same human-readable formats as `value` for size and time.Duration.

info:
  usage:
    - "Public identity card for this node. It is returned by HTTP /info and published in Yggdrasil NodeInfo through the info and inet sigils."
    - "Do not put secrets here: every mesh peer can read NodeInfo, and every HTTP client can read /info."
  name:
    type: string
    usage:
      - "Public node name used by /info and the Yggdrasil info sigil."
      - "Allowed length is 4..64 characters. Use lowercase letters, digits, dot, underscore, and hyphen only."
      - "Empty value is allowed. Runtime derives a valid name from web.server.domain, then from the Yggdrasil host, then falls back to the binary name."
      - "Examples: `mirror.example.org`, `vault.example`."
  description:
    type: string
    usage:
      - "Free-form public description or peering policy used by /info and the Yggdrasil info sigil."
      - "Non-empty values must be 2..514 characters and must not have leading or trailing whitespace."
      - "Example: `Go and Composer release mirror; peering on request`."
  location:
    type: string
    usage:
      - "Optional public location text used by /info and the Yggdrasil info sigil."
      - "Example: `EU/Frankfurt`."
  contacts:
    type: "map[string][]string"
    usage:
      - "Public contact groups used by /info and the Yggdrasil info sigil."
      - "Group keys use `[a-z0-9.-]`, length 2..32. Values use length 3..258 and must not have leading or trailing whitespace."
      - "At most 8 groups and at most 8 values per group."
      - "Example: `{mail: ['abuse@example.org'], admin: ['https://example.org/contact']}`."

release_mirrors:
  type: "map[string]string"
  usage:
    - "Mirror source registry: local key -> upstream repository root URL."
    - "Keys must match `^[a-z0-9][a-z0-9._-]{1,38}[a-z0-9]$`, must not equal web.server.domain, and must not use reserved route names such as `list`, `latest`, `@v`, `p2`, `packages.json`, `catalog.json`, or `feed.xml`."
    - "Values must be non-empty HTTP or HTTPS URLs with a host."

web:
  usage: "Web ingress, route topology, static file serving, and browser/API pagination."
  server:
    usage: "Web listener publication mode and bind addresses."
    domain:
      type: string
      usage:
        - "Canonical public web host."
        - "Used for entry host context, Go module paths, generated links, install commands, and the inet sigil when the domain is public."
        - "Required when any web listener is enabled."
    mode:
      enum_name: web-server-mode
      enum: [ shared, split, single ]
      value: shared
      usage:
        - "Listener topology."
        - "`shared`: one listener behind a TLS-terminating reverse proxy. Generated external scheme is always https."
        - "`split`: separate HTTP and HTTPS listeners. Both listen addresses must be set."
        - "`single`: one listener with an explicit protocol from web.server.single.proto."
    tls:
      usage:
        - "TLS termination performed by this process."
        - "Both cert and key empty means the listener is plain TCP and TLS is expected to terminate upstream, usually in a reverse proxy."
        - "Setting exactly one of cert/key is a startup error."
      cert:
        type: string
        usage: "Path to the TLS certificate file. Must be set together with web.server.tls.key."
      key:
        type: string
        usage: "Path to the TLS private key file. Must be set together with web.server.tls.cert."
    shared:
      usage: "Single listener for the `shared` mode. Intended for a reverse proxy that terminates TLS before yggvault."
      listen:
        type: string
        usage: "Bind address for the shared listener. Empty disables web ingress when mode=shared."
    split:
      usage: "Separate listeners for HTTP and HTTPS in `split` mode."
      http:
        usage: "Plain HTTP listener."
        listen:
          type: string
          usage: "Bind address for HTTP. Required when mode=split."
      https:
        usage: "HTTPS listener."
        listen:
          type: string
          usage: "Bind address for HTTPS. Required when mode=split."
    single:
      usage: "One listener with a fixed advertised protocol."
      proto:
        enum_name: web-proto
        enum: [ http, https ]
        value: http
        usage: "External scheme for single-listener mode."
      listen:
        type: string
        usage: "Bind address for the single listener. Empty disables web ingress when mode=single."
  ingress:
    usage: "Request-line, header, and connection time limits applied to all HTTP listeners."
    max_request_uri_bytes:
      type: uint
      value: 4096
      min: 256
      max: 16384
      usage: "Maximum raw RequestURI length, including path and query. Valid range: 256..16384 bytes."
    read_buffer_size:
      type: size
      value: 32768
      min: 8192
      max: 262144
      usage: "Read buffer for request line and headers. Must be at least max_request_uri_bytes + 1024. Accepts bytes or size strings such as `8KiB` and `256KiB`."
    read_header_timeout:
      type: time.Duration
      value: "10s"
      min: "1s"
      usage: "Timeout for reading incoming request headers on every listener. This is the slow-loris guard. Accepts Go duration strings such as `10s`, `5s`, or a nanosecond integer."
    idle_timeout:
      type: time.Duration
      value: "120s"
      min: "1s"
      usage: "Keep-alive idle timeout for incoming connections. Limits how long slow or idle clients can hold sockets. Accepts values such as `120s`, `1m`, or a nanosecond integer."
  static:
    usage:
      - "Optional user static tree served by the web listener."
      - "When disabled, API and browser routes live at the root. When enabled, user static files own `/`, while per-key API/browser routes move under web.routing.prefix. Stable service routes such as /health, /info, /metrics, and /openapi.json stay at their well-known root paths."
    dir:
      type: string
      usage:
        - "Root directory for static files."
        - "Empty value disables static serving and keeps root API routing."
        - "Non-empty value enables nested routing. The path must exist, be a readable directory, and contain web.static.index_file."
        - "Must not overlap storage.dir or logging.file.dir."
    index_file:
      type: string
      value: "index.html"
      usage: "Static index file returned for `/`. Must be a clean relative path inside web.static.dir."
    max_size:
      type: size
      value: "256mb"
      min: 1
      usage: "Maximum total size of regular files admitted into the static tree. File bodies are served from disk; the snapshot keeps path metadata, ETags, and routing data. Accepts values such as `256mb`, `1GiB`, or bytes."
    cache_max_age:
      type: time.Duration
      value: "24h"
      min: "1h"
      usage: "Client cache lifetime for static files through Cache-Control max-age. Accepts values such as `24h`, `15m`, or a nanosecond integer."
    deny:
      type: "[]string"
      value: [ ".env", ".key", ".pem", "/.git/", "/.hg/", "/.svn/", "/config.json", "/config.yaml", "/config.yml" ]
      usage:
        - "Case-insensitive deny rules for static files."
        - "Extension rule example: `.pem`."
        - "Path rule examples: `/private/`, `/private/secrets.txt`. Paths are web paths relative to the static root."
        - "Rules must not be empty and must not contain `..` or backslash."
  routing:
    usage: "API prefix used only when web.static.dir enables nested routing."
    prefix:
      type: string
      value: "pkg"
      usage:
        - "Single path segment used before per-key API and browser routes in nested mode."
        - "Must match `^[a-z0-9][a-z0-9._-]{0,31}$`."
        - "Must not be one of the stable service routes: `health`, `info`, `metrics`, `openapi.json`."
  pages:
    usage: "Rendering and listing limits for browser/API pages."
    list_page_size:
      type: uint
      value: 512
      min: 1
      max: 5000
      usage: "Page size for releases.json and the HTML key page. Valid range: 1..5000."
    feed_size:
      type: uint
      value: 50
      min: 1
      max: 500
      usage: "Number of recent history events exposed in Atom feeds. Includes publish and archive mutation events. Valid range: 1..500."
    sitemap_size:
      type: uint
      value: 100
      min: 1
      max: 50000
      usage: "Maximum number of URLs listed in /sitemap.xml (catalog, keys, and versions). On overflow, newest versions win. Valid range: 1..50000."

ygg:
  usage: "Yggdrasil ingress and peer manager settings."
  pem_key:
    type: string
    usage:
      - "Path to the node private key in PEM format."
      - "Relative paths are resolved against the process working directory."
      - "Empty value fully disables Yggdrasil ingress."
      - "When enabled, the node publishes HTTP on fixed Yggdrasil service port 80. Its host is `<PublicKey>.pk.ygg`; its transport address is an IPv6 address in 200::/7."
  peers:
    usage: "Yggdrasil peer manager configuration. Empty initial peer list disables peer manager startup."
    initial:
      type: "[]string"
      value: [ ]
      usage: "Initial peer URI candidates. Empty list disables peer manager startup."
    max_per_proto:
      type: uint
      value: 1
      min: 1
      usage: "Target number of best peers retained per transport protocol."
    probe_timeout:
      type: time.Duration
      value: "10s"
      min: "1s"
      usage: "Timeout for one peer probe batch. Accepts values such as `5s`, `500ms`, or a nanosecond integer."
    refresh_interval:
      type: time.Duration
      value: "0s"
      min: "0s"
      usage: "Interval between peer-pool refreshes. Zero means a single refresh at startup. Accepts values such as `5m`, `1h`, or a nanosecond integer."
    batch_size:
      type: uint
      value: 8
      min: 2
      usage: "Maximum peer candidates probed concurrently in one batch. Must be >= 2."

logging:
  usage: "Runtime logging pipeline and event sinks."
  console:
    usage: "stdout/stderr logging sink."
    enabled:
      type: bool
      value: true
      usage: "Enables console logging. At least one logging sink must stay enabled."
    level:
      enum_name: console-log-level
      enum: [ trace, debug, info, warn, error, fatal, panic ]
      value: info
      usage: "Minimum severity for console events. Severity order is trace < debug < info < warn < error < fatal < panic."
  file:
    usage: "Rotating file logging sink."
    enabled:
      type: bool
      usage: "Enables file logging. Requires logging.file.dir."
    level:
      enum_name: file-log-level
      enum: [ trace, debug, info, warn, error, fatal, panic ]
      value: info
      usage: "Minimum severity for file events. Same level names and ordering as logging.console.level."
    dir:
      type: string
      value: "./logs"
      usage: "Directory for rotated log files. Runtime writes `<target.Name>.log` inside this directory. Must not overlap storage.dir or web.static.dir."
    max_size:
      type: size
      value: "100mb"
      min: 1
      usage: "Rotation threshold for one log file. Accepts values such as `100mb`, `512MiB`, or bytes."
    max_backups:
      type: uint
      value: 30
      min: 1
      usage: "Maximum number of retained rotated files."
    max_age:
      type: time.Duration
      value: "336h"
      min: "24h"
      usage: "Retention window for rotated files. Accepts values such as `24h`, `336h`, or a nanosecond integer."
    compress:
      type: bool
      value: true
      usage: "Compresses rotated log files."
  victorialogs:
    usage: "Best-effort HTTP push of JSON log lines to VictoriaLogs. Intended for a trusted network; no auth is configured here, and traffic uses regular networking, not Yggdrasil."
    enabled:
      type: bool
      usage: "Enables the VictoriaLogs sink. It can be the only enabled logging sink."
    url:
      type: string
      usage: "Base VictoriaLogs URL, for example `http://127.0.0.1:9428`. Runtime appends `/insert/jsonline`."
    level:
      enum_name: victorialogs-log-level
      enum: [ trace, debug, info, warn, error, fatal, panic ]
      value: info
      usage: "Minimum severity sent to VictoriaLogs. Same level names and ordering as logging.console.level."
    flush_interval:
      type: time.Duration
      value: "5s"
      min: "100ms"
      usage: "Maximum delay before flushing the current batch. Accepts values such as `5s`, `1s`, or a nanosecond integer."
    batch_max_bytes:
      type: size
      value: "1mb"
      min: 1
      max: "64mb"
      usage: "Batch size threshold for early flush. Must be between 1 byte and 64 MB. Accepts values such as `1mb`, `512KiB`, or bytes."
    buffer_max_lines:
      type: uint
      value: 10000
      min: 1
      max: 1000000
      usage: "Maximum queued log lines. On overflow, new lines are dropped and counted; the file sink remains the source of truth if enabled. Hard cap: 1,000,000 lines."
    timeout:
      type: time.Duration
      value: "10s"
      min: "1s"
      usage: "Timeout for one VictoriaLogs push request. Accepts values such as `10s`, `5s`, or a nanosecond integer."
    gzip:
      type: bool
      value: true
      usage: "Compresses VictoriaLogs request bodies with gzip."

metrics:
  usage: "Metrics publication switches. If open, internal, and push are all disabled, telemetry is not built and metrics are not collected."
  web:
    usage: "Metrics exposed on the web ingress."
    public:
      type: bool
      value: true
      usage: "Publishes the HTML metrics index at /metrics and the JSON metric groups on web routes: /metrics/core, /metrics/cache, /metrics/errors, and /metrics/rescan."
    internal:
      type: bool
      value: false
      usage: "Publishes the full Prometheus text (0.0.4) exposition at /metrics/internal on web routes, for aggregators such as VictoriaMetrics or Prometheus."
  ygg:
    usage: "Metrics exposed on the Yggdrasil ingress."
    public:
      type: bool
      value: true
      usage: "Publishes the HTML metrics index and JSON metric groups on Yggdrasil routes. Same group set as metrics.web.public."
    internal:
      type: bool
      value: false
      usage: "Publishes the full Prometheus text (0.0.4) exposition at /metrics/internal on Yggdrasil routes, for internal aggregators."
  errors:
    usage: "Metrics derived from the in-memory Error Registry."
    recent_buffer:
      type: uint
      value: 20
      min: 1
      max: 1000
      usage: "Number of most recent diagnostics surfaced: the recent[] list in /metrics/errors and the recent_error series in the full /metrics/internal exposition. This caps size and cardinality. Valid range: 1..1000."
  snapshot_interval:
    type: time.Duration
    value: "1s"
    min: "1s"
    usage: "Interval for rebuilding the pre-rendered metrics snapshot. Accepts values such as `1s`, `5s`, or a nanosecond integer."
  push:
    usage: "Best-effort HTTP push of the metrics snapshot to VictoriaMetrics. Intended for a trusted network; no auth is configured here, and traffic uses regular networking, not Yggdrasil."
    enabled:
      type: bool
      usage: "Enables periodic push to one VictoriaMetrics endpoint."
    url:
      type: string
      usage: "Base VictoriaMetrics URL, for example `http://127.0.0.1:8428`. Runtime appends `/api/v1/import/prometheus`."
    interval:
      type: time.Duration
      value: "15s"
      min: "1s"
      usage: "Metrics push interval. Independent from metrics.snapshot_interval. Accepts values such as `15s`, `30s`, or a nanosecond integer."
    timeout:
      type: time.Duration
      value: "10s"
      min: "1s"
      usage: "Timeout for one metrics push request. Accepts values such as `10s`, `5s`, or a nanosecond integer."

rate_limit:
  usage:
    - "Token-bucket request limiting per transport."
    - "Each transport has a global bucket. requests_per_second=0 disables that bucket."
    - "Each transport can also have a per_peer bucket keyed by client address. per_peer.requests_per_second=0 disables per-peer limiting while leaving the global bucket independent."
  web:
    usage: "Rate-limit buckets for web listeners."
    http:
      usage: "Global and per-peer buckets for HTTP traffic."
      requests_per_second:
        type: uint
        value: 0
        usage: "Sustained token refill rate for the global HTTP bucket. 0 disables the global HTTP limit. Example active value: 20."
      burst:
        type: uint
        value: 0
        usage: "Global HTTP burst capacity. Required to be >= 1 when rate_limit.web.http.requests_per_second > 0. Example: 60."
      per_peer:
        usage: "Per-peer HTTP bucket layered on top of the global HTTP bucket."
        requests_per_second:
          type: uint
          value: 0
          usage: "Sustained per-peer HTTP rate. 0 disables per-peer HTTP limiting."
        burst:
          type: uint
          value: 0
          usage: "Per-peer HTTP burst capacity. Required to be >= 1 when per_peer.requests_per_second > 0."
        max_tracked:
          type: uint
          value: 4096
          usage: "Maximum concurrently tracked HTTP peers in the bounded LRU map. Required to be >= 1 when per-peer HTTP limiting is enabled."
    https:
      usage: "Global and per-peer buckets for HTTPS traffic. Same token-bucket semantics as rate_limit.web.http."
      requests_per_second:
        type: uint
        value: 0
        usage: "Sustained token refill rate for the global HTTPS bucket. Same semantics as rate_limit.web.http.requests_per_second."
      burst:
        type: uint
        value: 0
        usage: "Global HTTPS burst capacity. Same validation rule as rate_limit.web.http.burst."
      per_peer:
        usage: "Per-peer HTTPS bucket layered on top of the global HTTPS bucket. Same model as rate_limit.web.http.per_peer."
        requests_per_second:
          type: uint
          value: 0
          usage: "Sustained per-peer HTTPS rate. Same semantics as rate_limit.web.http.per_peer.requests_per_second."
        burst:
          type: uint
          value: 0
          usage: "Per-peer HTTPS burst capacity. Same validation rule as rate_limit.web.http.per_peer.burst."
        max_tracked:
          type: uint
          value: 4096
          usage: "Maximum concurrently tracked HTTPS peers. Same validation rule as rate_limit.web.http.per_peer.max_tracked."
  ygg:
    usage: "Global and per-peer buckets for Yggdrasil HTTP traffic. Peer identity is the stable Yggdrasil IPv6 client address."
    requests_per_second:
      type: uint
      value: 0
      usage: "Sustained token refill rate for the global Yggdrasil bucket. Same semantics as rate_limit.web.http.requests_per_second."
    burst:
      type: uint
      value: 0
      usage: "Global Yggdrasil burst capacity. Same validation rule as rate_limit.web.http.burst."
    per_peer:
      usage: "Per-peer Yggdrasil bucket layered on top of the global Yggdrasil bucket. Same model as rate_limit.web.http.per_peer."
      requests_per_second:
        type: uint
        value: 0
        usage: "Sustained per-peer Yggdrasil rate. Same semantics as rate_limit.web.http.per_peer.requests_per_second."
      burst:
        type: uint
        value: 0
        usage: "Per-peer Yggdrasil burst capacity. Same validation rule as rate_limit.web.http.per_peer.burst."
      max_tracked:
        type: uint
        value: 4096
        usage: "Maximum concurrently tracked Yggdrasil peers. Same validation rule as rate_limit.web.http.per_peer.max_tracked."

source:
  usage: "Outgoing source access: upstream timeouts, download parallelism, retries, and provider credentials."
  request_timeout:
    type: time.Duration
    value: "30s"
    min: "1s"
    usage: "Timeout budget for one outgoing upstream operation: HTTP, git-provider API, or Brother RPC. Accepts values such as `30s`, `1m`, or a nanosecond integer."
  download_max_parallel:
    type: uint
    value: 8
    min: 1
    usage: "Maximum number of source archive downloads running concurrently."
  retry:
    usage: "Retry policy for network and download failures. Runtime caps attempts in source code; these values shape the backoff between attempts."
    backoff_initial:
      type: time.Duration
      value: "500ms"
      min: "100ms"
      usage: "Initial retry delay. Accepts values such as `500ms`, `1s`, or a nanosecond integer."
    backoff_max:
      type: time.Duration
      value: "10s"
      min: "100ms"
      usage: "Upper bound for exponential retry delay. Must be >= source.retry.backoff_initial."
    jitter_percent:
      type: uint16
      value: 20
      min: 0
      max: 100
      usage: "Retry jitter amplitude in percent. Valid range: 0..100."
  credentials:
    usage:
      - "Optional authorization for upstream git providers."
      - "Credentials raise public API limits and can unlock private sources. For example, GitHub anonymous access is usually much lower than PAT access."
      - "Headers are applied only to matching provider API requests. They are never sent through mesh, Yggdrasil, or Brother traffic."
      - "Empty values mean anonymous access."
    github:
      type: string
      value: ""
      usage: "GitHub PAT. Runtime sends `Authorization: Bearer <token>` to github.com and *.github.com, including api.github.com. Empty value keeps anonymous access."
    gitlab:
      type: string
      value: ""
      usage: "GitLab PAT. Runtime sends `PRIVATE-TOKEN: <token>` to gitlab.com and *.gitlab.com. Empty value keeps anonymous access."
    bitbucket:
      type: string
      value: ""
      usage: "Bitbucket access token. Runtime sends `Authorization: Bearer <token>` to bitbucket.org and *.bitbucket.org. Empty value keeps anonymous access."
    others:
      type: "map[string]string"
      usage: "Self-hosted or other providers such as Gitea, Gogs, or self-hosted GitLab. Map exact host -> full header value, for example `Authorization: token <t>` or `PRIVATE-TOKEN: <t>`. Exact host entries take precedence over built-in provider matching."

rescan:
  usage: "Periodic source refresh scheduler."
  interval:
    type: time.Duration
    value: "6h"
    min: "1m"
    usage: "Delay between rescan cycles. Accepts values such as `6h`, `15m`, or a nanosecond integer."
  max_parallel_keys:
    type: uint
    value: 4
    min: 1
    usage: "Maximum number of registry keys scanned concurrently."
  initial_depth:
    type: uint
    value: 0
    usage: "Maximum source releases requested per scan. 0 means full available history."
  verify:
    usage: "Tiered deep re-verification of already mirrored git versions. Between deep verifies a version is checked cheaply through the git refs advertisement (tag -> commit sha); the archive is re-downloaded only for new versions, sha drift, or when its verification tier is due. The latest version of every key is deep-verified every cycle regardless of these intervals."
    recent_interval:
      type: time.Duration
      value: "168h"
      min: "1h"
      usage: "Deep-verify interval for recent versions (upstream positions 1..10 behind the latest). Accepts values such as `168h` or a nanosecond integer."
    archive_interval:
      type: time.Duration
      value: "720h"
      min: "1h"
      usage: "Deep-verify interval for archive versions (upstream positions 11 and older). Must be >= rescan.verify.recent_interval. Accepts values such as `720h` or a nanosecond integer."

storage:
  usage: "Durable source-of-truth storage and regenerable hot artifact cache under one root directory."
  dir:
    type: string
    value: "./cache"
    usage: "Root filesystem directory for Pebble blobs, SQLite metadata, hot artifacts, and overlay state. Must not overlap logging.file.dir or web.static.dir."
  in_flight_read_bytes:
    type: size
    value: "256mb"
    min: "1mb"
    usage: "Global budget for blob bytes materialized in RAM during read/write build paths. This is the main OOM backpressure for concurrent large artifact builds. Lower values reduce peak RAM but serialize more builds."
  overlay_build_max_parallel:
    type: uint
    value: 2
    min: 1
    usage: "Maximum number of source-derived overlay materializations running concurrently."
  pebble:
    usage: "Pebble durable engine tuning for blob and tree storage."
    compression:
      enum_name: pebble-compression
      enum: [ snappy, zstd, minlz, fastest, fast, balanced, good, none ]
      value: minlz
      usage:
        - "Compression profile for durable data blocks."
        - "`minlz`: default. On amd64 it usually stores slightly smaller than snappy with similar CPU; on arm64 it is effectively snappy. Pure Go, independent of CGO."
        - "`snappy`: slightly larger on disk than minlz, very low CPU, widely compatible. Pure Go."
        - "`fastest` / `fast`: same speed class as minlz/snappy with similar disk footprint. Pure Go."
        - "`zstd` / `good`: best disk density, but with CGO=0 the pure-Go codec is expensive on writes and raises allocation/GC pressure. Use it only when the build uses CGO=1 or disk is more important than write CPU."
        - "`balanced`: zstd only at the cold bottom of the LSM. Useful mainly on large stores with deep LSM levels; on small stores it behaves close to snappy."
        - "`none`: no compression. Highest disk use, lowest compression CPU. Useful for incompressible data or debugging."
    block_cache_size:
      type: size
      value: "128mb"
      min: "8mb"
      usage: "Pebble block cache size. It stores hot decompressed blocks and mostly affects repeated durable reads. Size it near the hot working set; values far above the working set waste RAM."
    memtable_size:
      type: size
      value: "64mb"
      min: "4mb"
      usage: "Pebble memtable size and write-side RAM floor. Larger values reduce flush frequency, write CPU, and allocation churn on write-heavy ingest. It should fit large blobs; a practical target is >= storage.archive_limits.size.per_file."
    verify_on_read:
      enum_name: durable-verify-on-read
      enum: [ always, sampled, never ]
      value: always
      usage:
        - "Integrity check for durable blobs and trees when they are read to build artifacts."
        - "`always`: default. Re-hashes every durable blob with BLAKE3. Highest CPU cost on cache misses, strongest self-check against key/value mismatch."
        - "`sampled`: verifies one sampled read out of N. Lower CPU for high ingest or rebuild workloads while still catching corruption probabilistically."
        - "`never`: trusts Pebble block checksums on read. Fastest, but yggvault will not rehash durable values until a write or another verification path."
  quota:
    usage: "Admission control and eviction for durable storage. The hot artifact cache has a separate storage.hot.max_size."
    max_total_size:
      type: size
      value: "10gb"
      usage:
        - "Hard cap for durable storage physical disk usage."
        - "0 disables durable quota checks and durable eviction."
        - "Accepts bytes or size strings such as `10gb` and `8GiB`."
    evict_to_size:
      type: size
      value: "8gb"
      usage:
        - "Target durable size after an eviction cycle. Also works as the warning threshold."
        - "Must be > 0 and lower than storage.quota.max_total_size when durable quota is enabled."
    retain_latest_per_key:
      type: uint
      value: 3
      min: 1
      usage: "Minimum number of newest versions retained for every key. This is the lower bound during durable eviction."
    max_versions_per_key:
      type: uint
      value: 0
      usage: "Proactive hard cap on versions per key. 0 disables this per-key cap. Non-zero values must be >= storage.quota.retain_latest_per_key."
    gc_interval:
      type: time.Duration
      value: "24h"
      min: "10m"
      usage: "Interval for incremental durable GC. It removes orphan blobs left after crashes or interrupted writes. Accepts values such as `10m`, `1h`, or a nanosecond integer."
  hot:
    usage: "Regenerable disk cache for built artifacts: Go/Composer zip files and universal zip/tar.gz files. This is separate from durable quota."
    max_size:
      type: size
      value: "2gb"
      min: "1mb"
      usage: "Upper bound for the hot/ directory. Overflow triggers LRU and idle-first eviction. Larger values reduce rebuild storms; smaller values save disk but increase CPU by rebuilding artifacts."
    idle_ttl:
      type: time.Duration
      value: "1h"
      min: "1m"
      usage: "Idle TTL for built artifacts. Files not requested for longer than this can be deleted and rebuilt on the next request. Increase for read-heavy repeated downloads; decrease to save disk."
    retain:
      enum_name: cache-retain-mode
      enum: [ all, latest, none ]
      value: latest
      usage: "Hot-file retention policy: `all` keeps every built version, `latest` keeps only the newest version per key where possible, and `none` rebuilds on demand. Artifact hashes remain in the database."
    verify_on_read:
      enum_name: hot-verify-on-read
      enum: [ always, sampled, never ]
      value: sampled
      usage:
        - "Integrity check for built hot files on the client-serving path."
        - "`always`: re-hashes the whole hot file on every serve. Strongest check, but latency is linear in artifact size and can dominate read-heavy large artifacts."
        - "`sampled`: default. Verifies one in 16 opens. Much cheaper than always while still detecting bit rot probabilistically."
        - "`never`: trusts file size and mtime on serve. Fastest, but a modified hot file is not detected until rebuild or another verification path."
        - "For integrity-critical deployments use `always`; for read-heavy large artifacts use `sampled` or `never` after accepting the trade-off."
  archive_limits:
    usage: "Abuse-protection limits for source archives."
    size:
      usage: "Byte caps for source archives."
      compressed:
        type: size
        value: "100mb"
        min: "1mb"
        usage: "Maximum compressed source archive size. Accepts values such as `100mb`, `256MiB`, or bytes."
      unpacked:
        type: size
        value: "512mb"
        min: "1mb"
        usage: "Maximum total unpacked bytes accepted from one source archive. Accepts values such as `512mb`, `1GiB`, or bytes."
      per_file:
        type: size
        value: "64mb"
        min: "1mb"
        usage: "Maximum single file size inside an archive. Must be <= storage.archive_limits.size.unpacked. Startup also rejects values above the real-memory safety cap. This value should fit in storage.pebble.memtable_size."
    entries:
      usage: "Structural caps for archive entries."
      count:
        type: uint
        value: 20000
        min: 1
        usage: "Maximum number of entries accepted from one source archive."
      path_bytes:
        type: uint
        value: 1024
        min: 32
        usage: "Maximum byte length of one archive entry path."

cache:
  usage: "RAM cache for small generated payloads only: list/latest/info/mod/composer metadata and ETags. Artifact bodies are served from hot files on disk, not from this cache."
  metadata_max_size:
    type: size
    value: "64mb"
    min: "1mb"
    usage: "RAM cap for prebuilt metadata and ETag cache. This is a hard size cap. Accepts values such as `64mb`, `256mb`, or bytes."

overlay:
  usage: "Safety settings for ecosystem-specific overlay materialization."
  go:
    usage: "Global Go overlay safety settings."
    rewrite_enabled:
      type: bool
      value: true
      usage:
        - "Allows yggvault to rewrite go.mod and Go imports when the upstream module path differs from the public target module path."
        - "If rewrite is required and this flag is false, the Go overlay for that version is not published."

history_policy:
  usage: "Version mutation and deletion policy for the local history chain."
  mutation:
    enum_name: history-mutation-mode
    enum: [ history, overwrite ]
    value: history
    usage: "`history` keeps historical pseudo-versions when an upstream version changes. `overwrite` replaces the stored version in place."
  deletion:
    usage: "Policy for upstream versions that disappear."
    mode:
      enum_name: history-deletion-mode
      enum: [ keep, delete ]
      value: keep
      usage: "`keep` retains upstream-deleted versions locally. `delete` removes them after grace_cycles consecutive missing scans."
    grace_cycles:
      type: uint
      value: 2
      min: 1
      usage: "Number of consecutive cycles where a version must be missing upstream before deletion mode can delete it."
  prefix:
    type: string
    value: "hr"
    usage: "Prefix for generated historical pseudo-versions: `v0.0.0-<prefix><n>`. Must match `^[a-z][a-z0-9]{0,15}$`."
  max_events:
    type: uint
    value: 100000
    min: 1
    usage: "Maximum number of stored history events used by Atom feeds and release history. Oldest events are deleted when the cap is exceeded."

upstream_availability:
  usage: "Policy for classifying upstream availability."
  permanent_after_cycles:
    type: uint
    value: 8
    min: 1
    usage: "Number of consecutive unavailable cycles before a source is classified as permanently unavailable."

brother:
  usage:
    - "RPC synchronization between yggvault instances. CONNECT /rpc can be exposed on the web and Yggdrasil listeners independently."
    - "The channel is read-only. When it is exposed on web, treat it as a public mirror surface and keep the RPC limits bounded."
  first_source_timeout:
    type: time.Duration
    value: "5s"
    min: "1s"
    usage: "How long a Brother key waits for the original source during update checks before trying the brother fallback. The original source remains authoritative in first_source mode."
  rpc:
    usage: "Limits for Brother RPC serving, outbound call pacing, and blob-fetch batch negotiation."
    web_enabled:
      type: bool
      value: true
      usage: "Expose Brother CONNECT /rpc on web listeners."
    ygg_enabled:
      type: bool
      value: true
      usage: "Expose Brother CONNECT /rpc on the Yggdrasil listener when Yggdrasil ingress is enabled."
    max_parallel:
      type: uint
      value: 4
      min: 1
      usage: "Maximum number of concurrent RPC sync sessions served on /rpc."
    max_parallel_per_peer:
      type: uint
      value: 0
      usage: "Maximum concurrent RPC sync sessions from one remote address, layered under max_parallel so one client cannot occupy every slot. 0 auto-derives half of max_parallel; set >= max_parallel to effectively disable per-peer fairness."
    rate_per_sec:
      type: uint
      value: 16
      usage: "RPC rate limit. The server applies it to new CONNECT /rpc sessions across web and Yggdrasil listeners; the source client applies it before outbound Brother RPC calls. 0 disables this limiter."
    max_fetch_response_bytes:
      type: size
      value: "256MiB"
      min: "1MiB"
      usage: "Maximum total blob bytes returned by one Brother.BlobsFetch response. The server advertises this in Hello; clients batch by the lower local/remote value."
    max_fetch_batch_count:
      type: uint
      value: 256
      min: 1
      max: 65536
      usage: "Maximum number of blob hashes accepted in one Brother.BlobsFetch request. The server advertises this in Hello; clients batch by the lower local/remote value."
  prefer:
    enum_name: brother-prefer
    enum: [ first_source, brother ]
    value: first_source
    usage: "`first_source` tries the original upstream first and uses Brother as fallback. `brother` tries Brother first and uses upstream as fallback, even after full Brother unavailability."
  transport_order:
    enum_name: brother-transport-order
    enum: [ web_ygg, ygg_web ]
    value: web_ygg
    usage: "Dial order when a Brother source advertises both web and Yggdrasil addresses: `web_ygg` tries web first, `ygg_web` tries Yggdrasil first."

shutdown_timeout:
  type: time.Duration
  value: "10s"
  min: "1s"
  usage: "Global graceful shutdown budget. Storage close still gets its own integrity budget in runtime shutdown code. Accepts values such as `10s`, `1m`, or a nanosecond integer."

profiling:
  usage: "Built-in net/http/pprof and runtime-trace listener for load diagnostics. Disabled mode starts no listener. Enabled mode must bind only to loopback; use an SSH tunnel for remote access."
  enabled:
    type: bool
    usage: "Starts the dedicated pprof listener. Disabled by default."
  listen:
    type: string
    value: "127.0.0.1:6060"
    usage: "Loopback host:port for the pprof listener. Public and unspecified binds are rejected. Example remote access: `ssh -L 6060:127.0.0.1:6060 host`."
  max_profile_seconds:
    type: uint
    value: 60
    min: 1
    max: 600
    usage: "Maximum accepted `?seconds=` value for /debug/pprof/profile and /debug/pprof/trace. Valid range: 1..600 seconds."
  contention:
    usage: "Block and mutex contention profiling. Defaults are zero-overhead; enable only for targeted diagnostics."
    block_rate:
      type: uint
      usage: "runtime.SetBlockProfileRate value: one blocking event sampled per N nanoseconds. 0 disables block profiling."
    mutex_fraction:
      type: uint
      usage: "runtime.SetMutexProfileFraction value: one mutex contention event sampled per N events. 0 disables mutex profiling."
