logging:
  console:
    enabled: true
    level: "info"
  file:
    enabled: true
    level: "debug"
    dir: "./logs"
    max_size: "100mb"
    max_backups: 30
    max_age: "336h"
    compress: true

shutdown_timeout: "10s"

info:
  name: "modules.example.org"
  description: "Public yggvault mirror for Go and Composer release artifacts; peering on request."
  location: "EU/Frankfurt"
  contacts:
    mail:
      - "abuse@example.org"

web:
  server:
    domain: "modules.example.org"
    mode: "shared"
    shared:
      listen: "0.0.0.0:80"

  ingress:
    max_request_uri_bytes: 4096
    read_buffer_size: 32768

  static:
    dir: ""

  routing:
    prefix: "pkg"

ygg:
  pem_key: "./yggvault.pem"
  peers:
    initial:
      # Pick nearby public peers:
      # - https://github.com/yggdrasil-network/public-peers
      # - https://publicpeers.neilalexander.dev/
      - "tls://replace-with-nearby-public-peer.example:443"

source:
  request_timeout: "30s"

release_mirrors:
  core-module: "https://example.org/mirror/core-module/"
  api-module: "https://example.org/mirror/api-module/"

overlay:
  go:
    rewrite_enabled: false

history_policy:
  mutation: "history"
  deletion:
    mode: "keep"
    grace_cycles: 2
  prefix: "hr"
