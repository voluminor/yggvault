logging:
  console:
    enabled: true
    level: "info"

info:
  name: "local-yggvault"
  description: "Local yggvault node for development."

web:
  server:
    domain: "localhost"
    mode: "single"
    single:
      proto: "http"
      listen: "127.0.0.1:8080"

ygg:
  pem_key: "./yggvault.pem"
  peers:
    initial:
      # Pick nearby public peers:
      # - https://github.com/yggdrasil-network/public-peers
      # - https://publicpeers.neilalexander.dev/
      - "tls://replace-with-nearby-public-peer.example:443"

release_mirrors:
  example-module: "https://example.org/mirror/example-module/"
