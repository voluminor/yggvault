name: 'Read version with Build scripts'
description: 'Read the version of the assembly and retain'
inputs:
  gometagen-version:
    description: 'Resolved gometagen version; latest is used when omitted'
    required: false
    default: 'latest'
outputs:
  name:
    description: 'Build package name'
    value: ${{ steps.ver.outputs.name }}
  version:
    description: 'Build version'
    value: ${{ steps.ver.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: 📥 Read version with Build scripts
      id: ver
      shell: bash
      run: |
        set -Eeuo pipefail
        gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ inputs.gometagen-version }}"
        nameBuild=$(go run "${gometagen}" manifest get -source ./_run/values.yml -field name)
        versionBuild=$(go run "${gometagen}" version print -source ./_run/values.yml)

        echo "BUILD_NAME=$nameBuild"   >  build_env.txt
        echo "BUILD_VER=$versionBuild" >> build_env.txt

        echo "name=$nameBuild"      >> "$GITHUB_OUTPUT"
        echo "version=$versionBuild" >> "$GITHUB_OUTPUT"

        echo "Found version: $versionBuild (Package Name: $nameBuild)"
