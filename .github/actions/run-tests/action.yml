name: 'Run tests and benchmarks'
description: 'Run go test with race detector and optional benchmarks'
inputs:
  run-benchmarks:
    description: 'Run benchmarks after tests (true/false)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: 🧪 Run race tests
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        CGO_ENABLED=1 go test -race -v ./...

    - name: 🧪 Run Windows tests
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        CGO_ENABLED=0 go test -v ./...

    - name: 🧪 Run Windows CGO storage tests
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        CGO_ENABLED=1 go test -v ./mod/storage/sqliteindex ./mod/storage

    - name: 📊 Run benchmarks
      if: inputs.run-benchmarks == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        CGO_ENABLED=1 go test -bench=. -run=NONE -benchmem -v ./...

    - name: 📊 Run Windows benchmarks
      if: inputs.run-benchmarks == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        set -Eeuo pipefail
        CGO_ENABLED=0 go test -bench=. -run=NONE -benchmem -v ./...
