name: "Tests & Benchmarks"

permissions: { }

concurrency:
  group: tests-${{ github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    # labeled is included so attaching the `bench` label re-runs the suite with benchmarks.
    types: [ opened, synchronize, reopened, labeled ]
    paths-ignore:
      - '**.txt'
      - '**.md'

env:
  GO_VERSION: "1.26"

jobs:
  prepare:
    name: "🔧 Prepare"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          check-clean: 'true'

      - name: 📦 Upload source
        uses: actions/upload-artifact@v7
        with:
          name: src-gen
          path: .

  test:
    name: "🧪 Test [${{ matrix.os }}]"
    needs: [ prepare ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 📥 Download source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: ${{ contains(github.event.pull_request.labels.*.name, 'bench') && 'true' || 'false' }}
