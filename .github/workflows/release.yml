name: "Release"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  RELEASE_SKIP_ENABLED: "true"

jobs:
  gate:
    name: "🚦 Gate"
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip || 'false' }}
      sha: ${{ steps.hash.outputs.sha }}
      marker-key: ${{ steps.hash.outputs.marker-key }}
      content-hash: ${{ steps.hash.outputs.content-hash }}
      generator-versions: ${{ steps.hash.outputs.generator-versions }}
      gometagen-version: ${{ steps.hash.outputs.gometagen-version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: 🔧 Install Go from go.mod
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version-file: go.mod

      - name: 🧮 Compute marker key
        id: hash
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # Pin the exact commit the skip decision was computed for; stage MUST build this SHA,
          # otherwise a push landing between gate and stage would release an untested tree.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          resolve_version() {
            go list -m -f '{{.Version}}' "$1@latest"
          }

          versions_file="${RUNNER_TEMP}/generator-versions.env"
          {
            echo "GOMETAGEN_VERSION=$(resolve_version github.com/amazing-generators/gometagen)"
            echo "GOCONFGEN_VERSION=$(resolve_version github.com/amazing-generators/goconfgen)"
            echo "GODEPSGEN_VERSION=$(resolve_version github.com/amazing-generators/godepsgen)"
            echo "GOOPENAPIGEN_VERSION=$(resolve_version github.com/amazing-generators/goopenapigen)"
          } > "$versions_file"

          set -a
          . "$versions_file"
          set +a

          tmp_index="${RUNNER_TEMP}/content.index"
          GIT_INDEX_FILE="$tmp_index" git read-tree HEAD
          GIT_INDEX_FILE="$tmp_index" git update-index --force-remove -- _run/values.yml >/dev/null 2>&1 || true
          tree_hash=$(GIT_INDEX_FILE="$tmp_index" git write-tree)

          matrix_descriptor='main-verify-v1:ubuntu-latest,ubuntu-24.04-arm,macos-latest,windows-latest:bench=true'
          content_hash=$(
            {
              echo 'schema-v1'
              echo "tree=${tree_hash}"
              cat "$versions_file"
              echo "matrix=${matrix_descriptor}"
            } | sha256sum | awk '{print $1}'
          )

          {
            echo "content-hash=${content_hash}"
            echo "marker-key=tests-green-v1-${content_hash}"
            echo "gometagen-version=${GOMETAGEN_VERSION}"
            echo "generator-versions<<GENERATOR_VERSIONS"
            cat "$versions_file"
            echo "GENERATOR_VERSIONS"
          } >> "$GITHUB_OUTPUT"

      - name: 🔎 Lookup green marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .ci/tests-green
          key: ${{ steps.hash.outputs.marker-key }}
          lookup-only: true

      - name: 🚦 Decide
        id: decide
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ env.RELEASE_SKIP_ENABLED }}" = "true" ] && [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  stage:
    name: "🔧 Stage bumped source"
    needs: [ gate ]
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.bump.outputs.base-sha }}
      build-ver: ${{ steps.build-env.outputs.version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          # The SHA the gate hashed — not the branch tip, which may have moved since.
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Increment minor version locally
        id: bump
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ needs.gate.outputs.gometagen-version }}"
          new_ver=$(go run "${gometagen}" version minor -source _run/values.yml)
          echo "New version: ${new_ver}"

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          generator-versions: ${{ needs.gate.outputs.generator-versions }}

      - id: build-env
        uses: ./.github/actions/generate-build-env
        with:
          gometagen-version: ${{ needs.gate.outputs.gometagen-version }}

      - name: 📦 Upload staged source
        uses: actions/upload-artifact@v7
        with:
          name: src-gen
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .
            !.git
            !.git/**

  test:
    name: "🧪 Test [${{ matrix.os }}]"
    needs: [ gate, stage ]
    if: needs.stage.result == 'success' && needs.gate.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]

    steps:
      - name: 📥 Download staged source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: 'false'

  build-nocgo:
    name: "🛠️ Build pure-Go (CGO=0)"
    needs: [ gate, stage, test ]
    if: >-
      !cancelled() &&
      needs.stage.result == 'success' &&
      (needs.test.result == 'success' || (needs.gate.outputs.skip == 'true' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download staged source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🛠️ Cross-compile server targets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          targets=(
            linux/amd64
            linux/arm64
            linux/arm/7
            linux/386
            linux/riscv64
            windows/amd64
            windows/arm64
            darwin/amd64
            darwin/arm64
            freebsd/amd64
          )

          for target in "${targets[@]}"; do
            IFS='/' read -r os arch variant <<< "$target"
            export GOOS="$os" GOARCH="$arch" CGO_ENABLED=0
            unset GOARM

            suffix=""; tag="${os}-${arch}"
            [[ "$os" == "windows" ]] && suffix=".exe"
            if [[ "$arch" == "arm" && -n "$variant" ]]; then
              export GOARM="$variant"
              tag="${os}-armv${variant}"
            fi

            outname="${BUILD_NAME}-${tag}${suffix}"
            echo "Building ${outname}"
            go build -trimpath -ldflags="-s -w" -o "dist/${outname}" .
          done

          echo "Built $(ls dist/ | wc -l) pure-Go binaries"
          ls -lhS dist/

      - name: 📦 Upload pure-Go binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-nocgo
          if-no-files-found: error
          path: dist/

  build-cgo:
    name: "🛠️ Build CGO [${{ matrix.goos }}/amd64]"
    needs: [ gate, stage, test ]
    if: >-
      !cancelled() &&
      needs.stage.result == 'success' &&
      (needs.test.result == 'success' || (needs.gate.outputs.skip == 'true' && needs.test.result == 'skipped'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  goos: linux,   ext: "" }
          - { runner: windows-latest, goos: windows, ext: ".exe" }

    steps:
      - name: 📥 Download staged source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🛠️ Build CGO binary (mattn/go-sqlite3)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          export GOOS="${{ matrix.goos }}" GOARCH=amd64 CGO_ENABLED=1
          outname="${BUILD_NAME}-${{ matrix.goos }}-amd64-cgo${{ matrix.ext }}"
          echo "Building ${outname}"
          go build -trimpath -ldflags="-s -w" -o "dist/${outname}" .
          ls -lhS dist/

      - name: 📦 Upload CGO binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-cgo-${{ matrix.goos }}
          if-no-files-found: error
          path: dist/

  release:
    name: "🚀 Release"
    needs: [ gate, stage, test, build-nocgo, build-cgo ]
    if: >-
      !cancelled() &&
      needs.stage.result == 'success' &&
      needs.build-nocgo.result == 'success' &&
      needs.build-cgo.result == 'success' &&
      (needs.test.result == 'success' || (needs.gate.outputs.skip == 'true' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 🛎️ Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.stage.outputs.base-sha }}
          fetch-depth: 0

      - name: 📥 Download staged source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - name: 📥 Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - uses: ./.github/actions/github-setup-user

      - name: 📤 Push release bump
        shell: bash
        run: |
          set -Eeuo pipefail
          base_sha="${{ needs.stage.outputs.base-sha }}"
          git fetch origin main --tags
          current_sha=$(git rev-parse refs/remotes/origin/main)
          if [ "$current_sha" != "$base_sha" ]; then
            echo "main moved from ${base_sha} to ${current_sha}" >&2
            exit 1
          fi

          git add _run/values.yml
          git diff --cached --quiet && { echo "release bump is empty" >&2; exit 1; }
          git commit -m "minor(${BUILD_VER}): release [skip ci]"
          git push origin HEAD:main --force-with-lease=refs/heads/main:${base_sha}

      - name: 🏷️ Create stripped tag ${{ env.BUILD_VER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIG_SHA=$(git rev-parse HEAD)

          git add -f target tmp

          paths_arr=()
          while IFS= read -r -d '' path; do
            paths_arr+=("$path")
          done < <(
            git ls-files -z \
              | grep -zE '^(\.github/|\.idea/|_generate/|_run/|tests/|yml/)|^(gen\.go|go\.work|go\.work\.sum|\.gitignore)$' || true
          )
          if [ "${#paths_arr[@]}" -gt 0 ]; then
            git rm -r --cached --ignore-unmatch -- "${paths_arr[@]}"
          fi

          git commit -m "release(${BUILD_VER}): embed generated assets, strip dev assets"
          git tag -a "${BUILD_VER}" -m "Release ${BUILD_VER}"
          git push origin "${BUILD_VER}"

          git reset --hard "$ORIG_SHA"

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_VER }}
          name: ${{ env.BUILD_VER }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            src-gen
            bin-nocgo
            bin-cgo-linux
            bin-cgo-windows
          failOnError: false
