name: "Release"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  GOMETAGEN: "github.com/amazing-generators/gometagen/cmd/gometagen@latest"

jobs:
  prepare:
    name: "🔧 Prepare"
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/tidy-all-and-generate

      - name: 📦 Upload source
        uses: actions/upload-artifact@v7
        with:
          name: src-gen
          path: .

  test:
    name: "🧪 Test [${{ matrix.os }}]"
    needs: [ prepare ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15, windows-latest ]

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: 📥 Download source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: 'false'

  bump-version:
    name: "📦 Minor version bump"
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/github-setup-user

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Increment minor version
        shell: bash
        run: |
          set -Eeuo pipefail
          new_ver=$(go run "${GOMETAGEN}" version minor -source _run/values.yml)
          echo "New version: ${new_ver}"

          git add _run/values.yml
          git diff --cached --quiet || git commit -m "minor(${new_ver}): release"
          git push origin HEAD:main

      - uses: ./.github/actions/tidy-all-and-generate

      - uses: ./.github/actions/generate-build-env

      - name: 📦 Upload bumped assets
        uses: actions/upload-artifact@v7
        with:
          name: bumped
          if-no-files-found: error
          path: |
            target
            tmp
            build_env.txt

  build-nocgo:
    name: "🛠️ Build pure-Go (CGO=0)"
    needs: [ bump-version ]
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: 📥 Download bumped assets
        uses: actions/download-artifact@v8
        with:
          name: bumped
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🛠️ Cross-compile server targets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist

          # format: GOOS/GOARCH[/arm-variant]
          targets=(
            linux/amd64
            linux/arm64
            linux/arm/7
            linux/386
            linux/riscv64
            windows/amd64
            windows/arm64
            darwin/amd64
            darwin/arm64
            freebsd/amd64
          )

          for target in "${targets[@]}"; do
            IFS='/' read -r os arch variant <<< "$target"
            export GOOS="$os" GOARCH="$arch" CGO_ENABLED=0
            unset GOARM

            suffix=""; tag="${os}-${arch}"
            [[ "$os" == "windows" ]] && suffix=".exe"
            if [[ "$arch" == "arm" && -n "$variant" ]]; then
              export GOARM="$variant"
              tag="${os}-armv${variant}"
            fi

            outname="${BUILD_NAME}-${tag}${suffix}"
            echo "→ ${outname}"
            go build -trimpath -ldflags="-s -w" -o "dist/${outname}" .
          done

          echo "=== Built $(ls dist/ | wc -l) pure-Go binaries ==="
          ls -lhS dist/

      - name: 📦 Upload pure-Go binaries
        uses: actions/upload-artifact@v7
        with:
          name: bin-nocgo
          if-no-files-found: error
          path: dist/

  build-cgo:
    name: "🛠️ Build CGO [${{ matrix.goos }}/amd64]"
    needs: [ bump-version ]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,  goos: linux,   ext: "" }
          - { runner: windows-latest, goos: windows, ext: ".exe" }

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: 📥 Download bumped assets
        uses: actions/download-artifact@v8
        with:
          name: bumped
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🛠️ Build CGO binary (mattn/go-sqlite3)
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          export GOOS="${{ matrix.goos }}" GOARCH=amd64 CGO_ENABLED=1
          outname="${BUILD_NAME}-${{ matrix.goos }}-amd64-cgo${{ matrix.ext }}"
          echo "→ ${outname}"
          go build -trimpath -ldflags="-s -w" -o "dist/${outname}" .
          ls -lhS dist/

      - name: 📦 Upload CGO binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-cgo-${{ matrix.goos }}
          if-no-files-found: error
          path: dist/

  release:
    name: "🚀 Release"
    needs: [ build-nocgo, build-cgo ]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 📥 Download bumped assets
        uses: actions/download-artifact@v8
        with:
          name: bumped
          path: .

      - name: 🗒️ Source env
        shell: bash
        run: cat build_env.txt >> "$GITHUB_ENV"

      - name: 📥 Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: 🔄 Refresh main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --tags
          git reset --hard origin/main

      - uses: ./.github/actions/github-setup-user

      - name: 🏷️ Create stripped tag ${{ env.BUILD_VER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ORIG_SHA=$(git rev-parse HEAD)

          # Embed generated assets into the tagged tree so it builds without generators.
          git add -f target tmp

          # Strip dev/generator/test/workspace assets from the release tag only.
          paths_arr=()
          while IFS= read -r -d '' path; do
            paths_arr+=("$path")
          done < <(
            git ls-files -z \
              | grep -zE '^(\.github/|\.idea/|_generate/|_run/|tests/|yml/)|^(gen\.go|go\.work|go\.work\.sum|\.gitignore)$' || true
          )
          if [ "${#paths_arr[@]}" -gt 0 ]; then
            git rm -r --cached --ignore-unmatch -- "${paths_arr[@]}"
          fi

          git commit -m "release(${BUILD_VER}): embed generated assets, strip dev assets"
          git tag -a "${BUILD_VER}" -m "Release ${BUILD_VER}"
          git push origin "${BUILD_VER}"

          git reset --hard "$ORIG_SHA"

      - name: 🚀 Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_VER }}
          name: ${{ env.BUILD_VER }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            src-gen
            bumped
            bin-nocgo
            bin-cgo-linux
            bin-cgo-windows
          failOnError: false
