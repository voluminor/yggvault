name: "Main Verify → Patch"

permissions:
  contents: write

concurrency:
  group: main-verify-main
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.txt'
      - '**.md'

env:
  GO_VERSION: "1.26"

jobs:
  gate:
    name: "🚦 Gate"
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip || 'false' }}
      marker-key: ${{ steps.hash.outputs.marker-key }}
      content-hash: ${{ steps.hash.outputs.content-hash }}
      generator-versions: ${{ steps.hash.outputs.generator-versions }}
      gometagen-version: ${{ steps.hash.outputs.gometagen-version }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 🔧 Install Go from go.mod
        uses: actions/setup-go@v5
        with:
          cache: false
          go-version-file: go.mod

      - name: 🧮 Compute marker key
        id: hash
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"

          resolve_version() {
            go list -m -f '{{.Version}}' "$1@latest"
          }

          versions_file="${RUNNER_TEMP}/generator-versions.env"
          {
            echo "GOMETAGEN_VERSION=$(resolve_version github.com/amazing-generators/gometagen)"
            echo "GOCONFGEN_VERSION=$(resolve_version github.com/amazing-generators/goconfgen)"
            echo "GODEPSGEN_VERSION=$(resolve_version github.com/amazing-generators/godepsgen)"
            echo "GOOPENAPIGEN_VERSION=$(resolve_version github.com/amazing-generators/goopenapigen)"
          } > "$versions_file"

          set -a
          . "$versions_file"
          set +a

          tmp_index="${RUNNER_TEMP}/content.index"
          GIT_INDEX_FILE="$tmp_index" git read-tree HEAD
          GIT_INDEX_FILE="$tmp_index" git update-index --force-remove -- _run/values.yml >/dev/null 2>&1 || true
          tree_hash=$(GIT_INDEX_FILE="$tmp_index" git write-tree)

          matrix_descriptor='main-verify-v1:ubuntu-latest,ubuntu-24.04-arm,macos-latest,windows-latest:bench=true'
          content_hash=$(
            {
              echo 'schema-v1'
              echo "tree=${tree_hash}"
              cat "$versions_file"
              echo "matrix=${matrix_descriptor}"
            } | sha256sum | awk '{print $1}'
          )

          {
            echo "content-hash=${content_hash}"
            echo "marker-key=tests-green-v1-${content_hash}"
            echo "gometagen-version=${GOMETAGEN_VERSION}"
            echo "generator-versions<<GENERATOR_VERSIONS"
            cat "$versions_file"
            echo "GENERATOR_VERSIONS"
          } >> "$GITHUB_OUTPUT"

      - name: 🔎 Lookup green marker
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .ci/tests-green
          key: ${{ steps.hash.outputs.marker-key }}
          lookup-only: true

      - name: 🚦 Decide
        id: decide
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: "🔧 Prepare"
    needs: [ gate ]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/tidy-all-and-generate
        with:
          check-clean: 'true'
          generator-versions: ${{ needs.gate.outputs.generator-versions }}

      - name: 📦 Upload source
        uses: actions/upload-artifact@v7
        with:
          name: src-gen
          path: .

  test:
    name: "🧪 Test [${{ matrix.os }}]"
    needs: [ gate, prepare ]
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: 📥 Download source
        uses: actions/download-artifact@v8
        with:
          name: src-gen
          path: .

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/run-tests
        with:
          run-benchmarks: 'true'

  certify:
    name: "✅ Certify"
    needs: [ gate, test ]
    if: needs.gate.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 📝 Write marker
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .ci/tests-green
          {
            echo "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "sha=${GITHUB_SHA}"
            echo "content_hash=${{ needs.gate.outputs.content-hash }}"
          } > .ci/tests-green/marker.txt

      - name: 💾 Save marker
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ci/tests-green
          key: ${{ needs.gate.outputs.marker-key }}

  bump-version:
    name: "📦 Patch version bump"
    needs: [ gate, prepare, test, certify ]
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      (needs.certify.result == 'success' || needs.certify.result == 'skipped') &&
      (needs.test.result == 'success' || (needs.gate.outputs.skip == 'true' && needs.test.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/github-setup-user

      - uses: ./.github/actions/init-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 📦 Increment patch version
        shell: bash
        run: |
          set -Eeuo pipefail
          gometagen="github.com/amazing-generators/gometagen/cmd/gometagen@${{ needs.gate.outputs.gometagen-version }}"
          new_ver=$(go run "${gometagen}" version patch -source _run/values.yml)
          echo "New version: ${new_ver}"

          git add _run/values.yml
          git diff --cached --quiet || git commit -m "patch(${new_ver}): auto-bump on main verify [skip ci]"
          git push origin HEAD:main

      - name: 🧹 Cleanup artifacts
        if: always()
        uses: geekyeggo/delete-artifact@v6
        with:
          name: src-gen
          failOnError: false
