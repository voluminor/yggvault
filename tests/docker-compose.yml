# 5 vault nodes + 2 peered yggdrasil hubs + TLS edge + verifier.
#
# Topology (see README):
#   ygg-hub-1/2 : peered yggdrasil backbone (hub-2 dials hub-1). Vault nodes peer OUT to ONE hub each
#                 (vault has no inbound peer listener); the inter-hub link makes the mesh one fabric.
#                 Nodes are split across hubs so EVERY brother link crosses hub-1<->hub-2 (multi-hop).
#   node-a   : GIT seed  (no-CGO, hub-1) -> mirrors a public Go repo       -> serves vault.test/errors
#   node-b   : GIT seed  (CGO,    hub-1) -> mirrors public composer repos  -> serves monolog/monolog + psr/log
#   node-c   : BROTHER  (CGO,    hub-2) -> of node-a over ygg  (cross-hub + cross-driver replication)
#   node-d   : BROTHER  (no-CGO, hub-2) -> of node-b over ygg  (cross-hub + cross-driver replication)
#   node-e   : BROTHER  (no-CGO, hub-1) -> of node-c over ygg  (cross-hub brother-of-brother)
#   edge     : nginx TLS terminator for the canonical host vault.test (network alias). Path-routes
#              /errors -> node-a (Go), everything else -> node-b (composer). Enables real https
#              `go get`/`composer install` with dist download against a single public domain.
#
# Images are prebuilt by scripts/up.sh (yrv:nocgo, yrv:cgo, yrv-ygghub, yrv-verifier); edge is stock nginx.
# All runtime state (keys, configs, certs, storage, logs, results) is bind-mounted from ../tmp/tests.

name: yrv-tests

x-vault-common: &vault-common
  restart: unless-stopped
  networks: [ meshnet ]
  depends_on: [ ygg-hub-1, ygg-hub-2 ]
  stop_grace_period: 20s
  # Run as the host user so bind-mounted state under tmp/ is user-owned: inspectable, removable by
  # `down.sh --clean`, and not root:root:0700 (which broke `go test ./...` tree-walks). Default 1000.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  # pprof binds loopback-only inside the container (validator requirement); the entrypoint's socat
  # bridges 127.0.0.1:PPROF_PORT -> 0.0.0.0:PPROF_FORWARD_PORT so the published port reaches it.
  environment:
    PPROF_PORT: "6060"
    PPROF_FORWARD_PORT: "6061"

networks:
  meshnet:
    driver: bridge

services:
  ygg-hub-1:
    image: yrv-ygghub:latest
    container_name: yrv-ygg-hub-1
    networks: [ meshnet ]
    environment:
      YGG_NAME: "ygg-hub-1"
      YGG_LISTEN_PORT: "7777"

  # hub-2 dials hub-1 -> peered backbone; leaf nodes on hub-2 reach leaf nodes on hub-1 over this link.
  ygg-hub-2:
    image: yrv-ygghub:latest
    container_name: yrv-ygg-hub-2
    networks: [ meshnet ]
    depends_on: [ ygg-hub-1 ]
    environment:
      YGG_NAME: "ygg-hub-2"
      YGG_LISTEN_PORT: "7777"
      YGG_PEERS: "tcp://ygg-hub-1:7777"

  node-a:
    <<: *vault-common
    image: yrv:nocgo
    container_name: yrv-node-a
    volumes:
      - ../tmp/tests/keys:/keys:ro
      - ../tmp/tests/node-a:/data
    ports:
      - "127.0.0.1:18081:8080"   # web / GOPROXY
      - "127.0.0.1:16060:6061"   # pprof + runtime-trace

  node-b:
    <<: *vault-common
    image: yrv:cgo
    container_name: yrv-node-b
    volumes:
      - ../tmp/tests/keys:/keys:ro
      - ../tmp/tests/node-b:/data
    ports:
      - "127.0.0.1:18082:8080"   # web / GOPROXY
      - "127.0.0.1:16061:6061"   # pprof + runtime-trace

  node-c:
    <<: *vault-common
    image: yrv:cgo
    container_name: yrv-node-c
    volumes:
      - ../tmp/tests/keys:/keys:ro
      - ../tmp/tests/node-c:/data
    ports:
      - "127.0.0.1:18083:8080"   # web / GOPROXY
      - "127.0.0.1:16062:6061"   # pprof + runtime-trace

  node-d:
    <<: *vault-common
    image: yrv:nocgo
    container_name: yrv-node-d
    volumes:
      - ../tmp/tests/keys:/keys:ro
      - ../tmp/tests/node-d:/data
    ports:
      - "127.0.0.1:18084:8080"   # web / GOPROXY
      - "127.0.0.1:16063:6061"   # pprof + runtime-trace

  node-e:
    <<: *vault-common
    image: yrv:nocgo
    container_name: yrv-node-e
    volumes:
      - ../tmp/tests/keys:/keys:ro
      - ../tmp/tests/node-e:/data
    ports:
      - "127.0.0.1:18085:8080"   # web / GOPROXY
      - "127.0.0.1:16064:6061"   # pprof + runtime-trace

  # TLS terminator for the canonical domain. The `vault.test` network alias makes every container on
  # meshnet resolve vault.test -> this proxy; it terminates TLS with the bootstrap-generated cert and
  # path-routes to the right backend. Runs as root (binds :443, mounts read-only only).
  edge:
    image: nginx:alpine
    container_name: yrv-edge
    restart: unless-stopped
    networks:
      meshnet:
        aliases: [ vault.test ]
    depends_on: [ node-a, node-b ]
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../tmp/tests/certs:/certs:ro
    ports:
      - "127.0.0.1:18443:443"   # canonical https (vault.test) for host-side checks

  verifier:
    image: yrv-verifier:latest
    container_name: yrv-verifier
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [ "verify" ]
    networks: [ meshnet ]
    depends_on: [ node-a, node-b, node-c, node-d, node-e, edge ]
    volumes:
      - ../tmp/tests/results:/out
      - ../tmp/tests/certs:/certs:ro   # trust the test CA for canonical-https checks
