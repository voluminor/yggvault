# TLS edge for the canonical host vault.test. Terminates TLS (bootstrap-generated cert) and reverse-
# proxies to the vault backends, so `go get` / `composer install` work over the real https domain with
# dist download — exactly as in a production single-domain deployment.
#
# Path routing matches the test fixtures' keys:
#   /vault.test/errors...  -> node-a  (Go: GOPROXY appends the full module path vault.test/errors)
#   /errors...             -> node-a  (the bare key form the node also serves; host-side smoke curl)
#   everything else        -> node-b  (composer: /p2/*, /packages.json, monolog & log dist zips)
#
# Backends are referenced via variables + a resolver so nginx starts even if a node is briefly down
# (runtime DNS instead of start-time resolution).

worker_processes  1;
events { worker_connections  1024; }

http {
    access_log  /dev/stdout;
    error_log   /dev/stderr  warn;

    # Docker embedded DNS; runtime resolution for variable upstreams.
    resolver        127.0.0.11 ipv6=off valid=10s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    server {
        listen              443 ssl;
        server_name         vault.test;

        ssl_certificate     /certs/vault.test.crt;
        ssl_certificate_key /certs/vault.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Go module key `errors`: GOPROXY canonical path /vault.test/errors/... and the bare /errors/...
        location ~ ^/(vault\.test/)?errors(/.*)?$ {
            set $go_backend "node-a:8080";
            proxy_pass http://$go_backend;
        }
        # composer metadata + dist zips (monolog, psr/log) -> the composer seed.
        location / {
            set $php_backend "node-b:8080";
            proxy_pass http://$php_backend;
        }
    }
}
